<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ミニゲーム・メドレー</title>
<meta name="description" content="手持ちのブラウザゲームを少しずつ連続で遊んで、最後に1つの総合スコアを出す。">
<style>
  :root{
    --bg0:#0c0f1a; --bg1:#1a2140;
    --accent:#ffb37a; --accent2:#ff8fb3;
    --line:rgba(255,255,255,.14);
    --text:#f4f1ea;
    --good:#7ddba4; --bad:#ff9a92;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    background:radial-gradient(120% 120% at 50% 0%,var(--bg1),var(--bg0) 75%);
    color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    user-select:none;
  }
  /* 100vh はスマホのアドレスバー表示中に可視領域より大きくなり上端が見切れる。dvh を優先 */
  #stage{position:relative;width:min(100vw,620px);height:min(100vh,900px);height:min(100dvh,900px);overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;}
  .screen.active{display:flex;animation:screenIn .38s ease-out;}
  #play.active{animation:fadeIn .3s ease-out;}
  @keyframes screenIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  /* 背景のまたたく星 */
  #stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;
    background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),
      radial-gradient(2px 2px at 40% 34%,#ffd9b8,transparent),radial-gradient(1px 1px at 90% 46%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 22% 62%,#ffc4da,transparent),radial-gradient(1px 1px at 64% 72%,#fff,transparent),
      radial-gradient(2px 2px at 8% 86%,#fff,transparent),radial-gradient(1.5px 1.5px at 84% 90%,#ffd9b8,transparent),
      radial-gradient(1px 1px at 52% 8%,#fff,transparent),radial-gradient(1px 1px at 33% 92%,#fff,transparent);
    animation:twinkle 4.5s ease-in-out infinite alternate;opacity:.55;}
  @keyframes twinkle{0%{opacity:.25}100%{opacity:.8}}
  /* ?fast=1(自動テスト)と「動きを減らす」設定では演出を一瞬で終える */
  body.calm *,body.calm *::before,body.calm *::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01s!important;transition-delay:0s!important;}

  /* ===== タイトル(ロゴ+はじめる+あそびかただけ。ルール文は置かない) ===== */
  #title{justify-content:center;padding:24px;text-align:center;}
  .logo{font-size:clamp(28px,8.4vw,44px);font-weight:900;letter-spacing:.05em;line-height:1.25;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,179,122,.35));animation:logoFloat 4.2s ease-in-out infinite;}
  @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .sub{margin-top:8px;font-size:12px;letter-spacing:.28em;color:var(--accent);opacity:.9;}
  .rule{max-width:320px;font-size:13px;line-height:1.9;text-align:left;}
  .rule p{margin:0 0 10px;} .rule p:last-child{margin-bottom:0;}
  .rule b{color:var(--accent);}
  .btn{margin-top:22px;cursor:pointer;user-select:none;border:none;
    padding:15px 46px;font-size:18px;font-weight:800;letter-spacing:.1em;
    color:#2a1608;border-radius:40px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    box-shadow:0 0 26px rgba(255,143,179,.4);
    transition:transform .12s,box-shadow .2s;touch-action:manipulation;}
  #startBtn{animation:btnPulse 2.4s ease-in-out infinite;}
  @keyframes btnPulse{0%,100%{box-shadow:0 0 26px rgba(255,143,179,.4)}50%{box-shadow:0 0 42px rgba(255,143,179,.75),0 0 12px rgba(255,179,122,.6)}}
  .btn:hover{transform:translateY(-2px) scale(1.03);}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:none;color:var(--text);border:1px solid var(--line);
    box-shadow:none;font-size:13px;padding:10px 22px;letter-spacing:.06em;margin-top:12px;}
  #bestLabel,#countLabel,#note{margin-top:12px;font-size:12px;opacity:.6;min-height:14px;}
  #note{color:var(--bad);opacity:.9;}

  /* ===== タイトルの回転カード(収録ゲームのタイトルが輪になって回る) ===== */
  #title .btn{margin-top:14px;}
  #carousel{position:relative;z-index:0;isolation:isolate;width:100%;height:215px;margin:10px 0 0;touch-action:pan-y;cursor:grab;user-select:none;}
  #carousel.drag{cursor:grabbing;}
  #carouselGlow{position:absolute;left:50%;top:54%;width:78%;height:70%;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,143,179,.28),rgba(255,179,122,.10) 55%,transparent 75%);pointer-events:none;}
  #carouselFloor{position:absolute;left:50%;bottom:18px;width:70%;height:26px;transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,179,122,.28),transparent 80%);pointer-events:none;}
  .cCard{position:absolute;left:50%;top:50%;width:112px;height:150px;margin:-82px 0 0 -56px;border-radius:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 8px;text-align:center;
    border:1px solid rgba(255,255,255,.3);box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);
    pointer-events:none;will-change:transform,opacity;}
  .cCard .ic{font-size:42px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));}
  .cCard .nm{font-size:13px;font-weight:800;line-height:1.35;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.5);word-break:keep-all;overflow-wrap:anywhere;}
  .cCard .tg{font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.35);color:#fff;opacity:.9;}
  .cCard.soon{filter:grayscale(.85) brightness(.8);}
  .cCard .art{position:absolute;inset:0;border-radius:inherit;background-size:cover;background-position:center;}
  .cCard .scrim{position:absolute;left:0;right:0;bottom:0;height:62%;border-radius:0 0 18px 18px;background:linear-gradient(transparent,rgba(6,8,18,.92));}
  .cCard.hasArt{justify-content:flex-end;padding:0 7px 9px;overflow:hidden;gap:0;}
  .cCard.hasArt .ic{display:none;}
  .cCard.hasArt .nm{position:relative;font-size:12px;letter-spacing:-.02em;}
  .row2{display:flex;gap:10px;justify-content:center;}
  @media (max-height:640px){
    #carousel{height:190px;margin-top:4px;}
    .cCard{width:96px;height:128px;margin:-70px 0 0 -48px;} .cCard .ic{font-size:34px;} .cCard .nm{font-size:12px;}
    #title .btn{margin-top:10px;}
  }

  /* ===== あそびかた(モーダル) ===== */
  #howtoOverlay{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(8,10,20,.72);backdrop-filter:blur(2px);padding:20px;}
  #howtoOverlay.show{display:flex;}
  .howtoCard{background:rgba(26,33,64,.95);border:1px solid var(--line);border-radius:16px;
    padding:26px 30px;text-align:center;max-width:360px;}
  .howtoCard h2{font-size:18px;margin-bottom:14px;letter-spacing:.06em;}

  /* 音のON/OFF。どの画面でも右上に出す */
  .muteBtn{position:absolute;top:10px;right:10px;z-index:50;width:38px;height:38px;border-radius:999px;
    border:1px solid var(--line);background:rgba(11,16,32,.7);color:#fff;font-size:16px;cursor:pointer;
    touch-action:manipulation;}
  .muteBtn.off{opacity:.55;}

  /* ===== プレイ(ハブ。ゲーム本体は iframe) ===== */
  #play{justify-content:flex-start;}
  #hud{width:100%;display:flex;align-items:center;gap:8px;padding:12px 56px 10px 14px;font-size:13px;letter-spacing:.04em;flex:none;}
  #hud .chip{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums;}
  #hud .chip b{color:var(--accent);}
  #dots{display:flex;gap:6px;flex:1;justify-content:center;}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);}
  .dot.now{background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .dot.done{background:var(--good);animation:dotPop .45s cubic-bezier(.2,1.8,.4,1);}
  @keyframes dotPop{0%{transform:scale(.4)}100%{transform:scale(1)}}
  #quitBtn{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:6px 12px;font-size:12px;cursor:pointer;}
  #frameWrap{position:relative;flex:1;min-height:0;width:100%;background:#000;}
  #frameWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;}
  #overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;background:radial-gradient(120% 120% at 50% 30%,rgba(26,33,64,.97),rgba(12,15,26,.98));}
  #overlay[hidden]{display:none;}
  #ovKicker{font-size:12px;letter-spacing:.3em;color:var(--accent);margin-bottom:10px;min-height:16px;}
  #ovArt{width:clamp(76px,22vw,104px);aspect-ratio:3/4;border-radius:14px;background-size:cover;background-position:center;margin-bottom:14px;
    border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 30px rgba(255,143,179,.25);}
  #ovArt[hidden]{display:none;}
  #ovArt.in{animation:artIn .55s cubic-bezier(.2,1.4,.4,1);}
  @keyframes artIn{0%{transform:translateY(26px) scale(.6) rotate(-9deg);opacity:0}100%{transform:none;opacity:1}}
  #ovCmd{font-size:clamp(34px,11vw,56px);font-weight:900;letter-spacing:.04em;line-height:1.15;color:#fff;margin:0 0 6px;
    text-shadow:0 0 24px rgba(255,143,179,.75),0 4px 0 rgba(120,40,90,.55);}
  #ovCmd:empty{display:none;}
  #ovCmd.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1);}
  @keyframes slam{0%{transform:scale(2.6) rotate(-7deg);opacity:0}55%{transform:scale(.9) rotate(1.5deg);opacity:1}100%{transform:none}}
  #overlay.hasCmd #ovTitle{font-size:16px;font-weight:700;opacity:.85;letter-spacing:.08em;}
  #ovSub.bounce,#ovTitle.bounce{animation:bounceIn .5s cubic-bezier(.2,1.5,.4,1);}
  @keyframes bounceIn{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
  #goFlash{position:absolute;left:0;right:0;top:34%;z-index:6;text-align:center;pointer-events:none;opacity:0;
    font-size:clamp(64px,22vw,110px);font-weight:900;letter-spacing:.06em;color:#fff;
    text-shadow:0 0 30px rgba(255,143,179,.95),0 0 60px rgba(255,179,122,.8),0 5px 0 rgba(120,40,90,.6);}
  #goFlash.go{animation:goFlash .7s ease-out;}
  @keyframes goFlash{0%{transform:scale(.4);opacity:0}22%{transform:scale(1.15);opacity:1}100%{transform:scale(1.7);opacity:0}}
  #ovTitle{font-size:clamp(26px,8vw,40px);font-weight:900;letter-spacing:.05em;line-height:1.3;}
  #ovSub{margin-top:12px;font-size:14px;opacity:.8;line-height:1.7;min-height:24px;}
  #ovCount{margin-top:18px;font-size:72px;font-weight:900;color:var(--accent);min-height:84px;font-variant-numeric:tabular-nums;
    filter:drop-shadow(0 0 16px rgba(255,179,122,.45));}
  #ovCount.pop{animation:pop .5s ease-out;}
  @keyframes pop{0%{transform:scale(2.3);opacity:0}50%{transform:scale(.88);opacity:1}100%{transform:scale(1);opacity:1}}
  #ovBar{width:min(240px,70%);height:10px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden;}
  #ovBar[hidden]{display:none;}
  #ovBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .6s ease-out;}

  /* ===== せってい(遊ぶゲームをえらぶ) ===== */
  #settings{justify-content:flex-start;padding:22px 16px 16px;text-align:center;}
  #settings h2{font-size:18px;letter-spacing:.08em;margin-bottom:6px;}
  #poolInfo{font-size:12px;color:var(--accent);min-height:32px;line-height:1.6;margin-bottom:8px;}
  #gameList{flex:1;min-height:0;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px;-webkit-overflow-scrolling:touch;}
  .gRow{display:flex;align-items:center;gap:12px;flex:none;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.06);text-align:left;cursor:pointer;}
  .gRow.off{opacity:.55;cursor:default;}
  .gRow input{width:20px;height:20px;flex:none;accent-color:var(--accent);}
  .gThumb{flex:none;width:32px;height:43px;border-radius:7px;object-fit:cover;border:1px solid var(--line);background:rgba(255,255,255,.06);}
  .gTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .gTxt b{font-size:14px;} .gTxt i{font-style:normal;font-size:11px;opacity:.7;line-height:1.5;}
  .gTag{flex:none;font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);opacity:.8;}
  #settings .btn.ghost{flex:none;margin-top:10px;}

  /* ===== 結果 ===== */
  #result{justify-content:center;padding:24px 20px;text-align:center;}
  #result h2{font-size:14px;letter-spacing:.2em;color:var(--accent);margin-bottom:4px;}
  #rank{font-size:96px;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,179,122,.4));}
  #rank.rS{background-image:linear-gradient(180deg,#fff6c9,#ffd34e 55%,#ff9a3d);filter:drop-shadow(0 0 26px rgba(255,211,78,.7));}
  #rank.rB{background-image:linear-gradient(90deg,#7ddba4,#4fc3d9);filter:drop-shadow(0 0 20px rgba(79,195,217,.4));}
  #rank.rC{background-image:linear-gradient(90deg,#9aa6c4,#6f7ba0);filter:drop-shadow(0 0 14px rgba(154,166,196,.3));}
  #rank.stamp{animation:rankStamp .75s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--rd,1.2s);}
  #rank.stamp.rS{animation:rankStamp .75s cubic-bezier(.2,1.2,.4,1) both,rankGlow 2.2s ease-in-out infinite;animation-delay:var(--rd,1.2s),calc(var(--rd,1.2s) + .8s);}
  @keyframes rankStamp{0%{transform:scale(3.4) rotate(-14deg);opacity:0}55%{transform:scale(.86) rotate(3deg);opacity:1}78%{transform:scale(1.08) rotate(-1deg)}100%{transform:none;opacity:1}}
  @keyframes rankGlow{0%,100%{filter:drop-shadow(0 0 22px rgba(255,211,78,.55))}50%{filter:drop-shadow(0 0 40px rgba(255,211,78,.95))}}
  #confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;}
  #total{margin:6px 0 10px;font-size:15px;}
  #total b{font-size:32px;color:var(--accent);} #total .new{color:var(--good);font-size:12px;margin-left:8px;}
  #rows{width:min(320px,100%);display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
  .row{display:flex;align-items:center;gap:8px;font-size:13px;text-align:left;animation:rowIn .45s ease-out both;animation-delay:calc(var(--i,0) * .16s);}
  @keyframes rowIn{0%{opacity:0;transform:translateX(-18px)}100%{opacity:1;transform:none}}
  .row .th{flex:none;width:26px;height:35px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:rgba(255,255,255,.06);}
  .row .nm{flex:none;width:116px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;}
  .row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transform-origin:left;
    animation:barGrow .8s ease-out both;animation-delay:calc(var(--i,0) * .16s + .2s);}
  @keyframes barGrow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  .row .pt{flex:none;width:32px;text-align:right;font-variant-numeric:tabular-nums;}
  .row.err .pt{color:var(--bad);}
  #result .btn{margin-top:14px;}
  #result .btn,#result .btn.ghost{animation:fadeIn .5s ease-out both;animation-delay:var(--bd,1.6s);}
  #result .btn.ghost{margin-top:8px;}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <button class="muteBtn" id="muteBtn" aria-label="音を消す/出す" title="音を消す/出す">🔊</button>

  <!-- ================= タイトル ================= -->
  <section id="title" class="screen active">
    <div class="logo">ミニゲーム<br>メドレー</div>
    <div class="sub">MINI GAME MEDLEY</div>
    <div id="carousel" aria-hidden="true"><div id="carouselGlow"></div><div id="carouselFloor"></div></div>
    <button class="btn" id="startBtn">はじめる</button>
    <div class="row2">
      <button class="btn ghost" id="howtoBtn">あそびかた</button>
      <button class="btn ghost" id="settingsBtn">せってい</button>
    </div>
    <div id="note"></div>
    <div id="bestLabel"></div>
    <div id="countLabel"></div>
  </section>

  <div id="howtoOverlay">
    <div class="howtoCard">
      <h2>あそびかた</h2>
      <div class="rule">
        <p>いくつかのゲームを<b>20〜30秒ほどずつ</b>、つづけて遊びます。</p>
        <p>ゲームごとに<b>0〜100点</b>。最後に合計して、ランクが出ます。</p>
        <p>はじまる前に、<b>3・2・1</b>のカウントダウンがあります。</p>
      </div>
      <button class="btn ghost" id="howtoCloseBtn">とじる</button>
    </div>
  </div>

  <!-- ================= せってい ================= -->
  <section id="settings" class="screen">
    <h2>遊ぶゲームをえらぶ</h2>
    <div id="poolInfo"></div>
    <div id="gameList"></div>
    <button class="btn ghost" id="allOnBtn">ぜんぶ選ぶ</button>
    <button class="btn ghost" id="settingsBackBtn">もどる</button>
  </section>

  <!-- ================= プレイ ================= -->
  <section id="play" class="screen">
    <div id="hud">
      <div class="chip">合計 <b id="hudTotal">0</b></div>
      <div id="dots"></div>
      <button id="quitBtn">やめる</button>
    </div>
    <div id="frameWrap">
      <div id="overlay">
        <div id="ovKicker"></div>
        <div id="ovArt" hidden></div>
        <div id="ovCmd"></div>
        <div id="ovTitle"></div>
        <div id="ovSub"></div>
        <div id="ovCount"></div>
        <div id="ovBar" hidden><i></i></div>
      </div>
      <div id="goFlash">GO!</div>
    </div>
  </section>

  <!-- ================= 結果 ================= -->
  <section id="result" class="screen">
    <h2>MEDLEY RESULT</h2>
    <div id="rank">-</div>
    <div id="total"></div>
    <div id="rows"></div>
    <button class="btn" id="retryBtn">もういちど</button>
    <button class="btn ghost" id="shareBtn">結果を共有する</button>
    <button class="btn ghost" id="toTitleBtn">タイトルへ</button>
    <canvas id="confetti"></canvas>
  </section>
</div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);

  /* =========================================================
     1. GAMES — 呼び出すゲームの一覧(id → 公開URL)。
        ready:false のゲームは通常の抽選に入らない(まだ ?mini=1 に対応していない)。
        ローカル確認用に ?u.<id>=<url> でURLを差し替え、?ids=a,b,c で出すゲームと順番を固定できる。
     ========================================================= */
  const ORIGIN = "https://masa0980-sudo.github.io/";
  const GAMES = [
    { id:"mochi-exit",  name:"もち出口",       tip:"最初の通路を覚えて、違えば引き返せ！", url:ORIGIN + "mochi-exit/", sec:30, ready:true },
    { id:"mochi-jump",  name:"もちジャンプ",   tip:"ときなこを集めて進め！",      url:ORIGIN + "mochi-jump/",  sec:20, ready:true },
    { id:"tennis-game", name:"ラリーテニス",   tip:"ミスしないで打ち返せ！",      url:ORIGIN + "tennis-game/", sec:20, ready:true },
    { id:"neon-void",   name:"ネオン・ヴォイド", tip:"撃って、よけて、生き残れ！",  url:ORIGIN + "neon-void/",   sec:20, ready:true },
    { id:"rhythm-game", name:"ぴったりリング",   tip:"リングがまん中に来たらタップ！", url:ORIGIN + "Rhythm_game/", sec:20, ready:true },

  /* 演出の長さ(ms)。?fast=1 は自動テスト用に短縮する */

  /* 数字をなめらかに増やす(CALM のときは即座に確定) */
  function tweenNum(el, from, to, ms, fmt){

    if(CALM || from === to){ el.textContent = fmt(to); return; }

    (function step(now){
      if(el._tw !== my) return;

  /* =========================================================
     2. Sfx — カウントダウンの音だけ(WebAudio)。ミュートは master ゲインで一括。
     ========================================================= */
  const Sfx = (function(){
    let ac = null, master = null;
    const MUTE_KEY = "mini-medley:muted";
    let muted = false;
    try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) {}
    function ensure(){
      if(!ac){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination); }
      if(ac.state === "suspended") ac.resume();
    }
    function setMuted(on){ muted = !!on; try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (e) {} if(master) master.gain.value = muted ? 0 : 1; }
    function tone(freq, dur, type, gain, delay){
      if(!ac) return;
      const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain || 0.15, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
    }
    return {
      ensure, setMuted, isMuted: () => muted,
      tick(){ tone(660, 0.1, "sine", 0.14); },
      go(){ tone(990, 0.28, "triangle", 0.16); tone(1320, 0.22, "sine", 0.1, 0.06); },
      slam(){ tone(130, 0.22, "square", 0.12); tone(65, 0.3, "sine", 0.18); tone(520, 0.12, "triangle", 0.08, 0.04); },
      score(n){ const base = n >= 80 ? 784 : n >= 50 ? 659 : 494; tone(base, 0.2, "triangle", 0.14); tone(base * 1.5, 0.3, "sine", 0.1, 0.12); },
      clear(){ [523,659,784,1047].forEach((f,i)=> tone(f, 0.3, "triangle", 0.14, i*0.1)); }
    };
  })();

  /* =========================================================
     3. PlayCounts — 累計プレイ回数(Firestore REST)。姉妹作品共通の rythm-game-mo。
        メドレー1回につき gameId "mini-medley" を1回だけ数える(各ゲーム側は ?mini=1 では数えない約束)。
     ========================================================= */
  const PlayCounts = (function(){
    const PROJECT_ID = "rythm-game-mo";
    const API_KEY = "AIzaSyBBo4f_LqJ2lfdKu8Q11oeiiYq_O-15LSc";
    const ROOT = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents";
    const IS_LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === "file:";
    function increment(gameId){
      if(IS_LOCAL) return Promise.resolve();
      const commitUrl = ROOT + ":commit?key=" + API_KEY;
      const docPath = "projects/" + PROJECT_ID + "/databases/(default)/documents/playCounts/" + encodeURIComponent(gameId);
      const incrementBody = { writes: [{ transform: { document: docPath, fieldTransforms: [{ fieldPath: "count", increment: { integerValue: "1" } }] } }] };
      const createBody = { writes: [{ update: { name: docPath, fields: { count: { integerValue: "1" } } }, currentDocument: { exists: false } }] };
      return fetch(commitUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(incrementBody) })
        .then(function(res){ if(res.ok) return; return fetch(commitUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(createBody) }); })
        .catch(function(e){ console.warn("playCount increment failed:", e); });
    }
    function fetchCount(gameId){
      const url = ROOT + "/playCounts/" + encodeURIComponent(gameId) + "?key=" + API_KEY;
      return fetch(url).then(function(res){ return res.ok ? res.json() : null; })
        .then(function(doc){ if(!doc || !doc.fields || !doc.fields.count) return null; return parseInt(doc.fields.count.integerValue, 10); })
        .catch(function(e){ console.warn("playCount fetch failed:", e); return null; });
    }
    return { increment, fetchCount };
  })();

  /* =========================================================
     4. Best — 合計点の自己ベスト(localStorage)。
     ========================================================= */
  const Best = (function(){
    const KEY = "mini-medley:best";
    function load(){ try { const o = JSON.parse(localStorage.getItem(KEY) || "{}"); return { total: o.total || 0, max: o.max || 0 }; } catch (e) { return { total:0, max:0 }; } }
    function record(total, max){
      const b = load();
      // 本数が違うメドレーどうしを比べるため、満点に対する割合で更新を判定する
      const better = !b.max || total / max > b.total / b.max;
      if(better) try { localStorage.setItem(KEY, JSON.stringify({ total, max })); } catch (e) {}
      return better;
    }
    return { load, record };
  })();

  /* =========================================================

        (iframe を残すと、そのゲームの音もタイマーも鳴り続けるため。常に iframe は1つだけ)
        プロトコル(詳細は CLAUDE.md):
          hub → game : URL に ?mini=1&sec=N&mute=0|1
          game → hub : {type:"mini-ready", game}                読み込み完了・待機中
          hub → game : {type:"mini-go"}                          カウントダウン後に開始の合図
          game → hub : {type:"mini-result", game, score:0-100, detail}  終了(時間切れでも必ず返す)
     ========================================================= */
  const SCREENS = ["title","settings","play","result"];
  function show(id){
    SCREENS.forEach(s => $(s).classList.toggle("active", s === id));
    if(id === "title") carouselStart(); else carouselStop();
    if(id !== "result" && confettiRaf) confettiStop();

  let run = null;                       // 進行中のメドレー { abort, list, results, idx }
  const cancels = new Set();
  function cancelAll(){ cancels.forEach(fn => fn()); cancels.clear(); }
  function sleep(ms){ return new Promise(res => { const t = setTimeout(res, ms); cancels.add(() => { clearTimeout(t); res(); }); }); }
  function waitMsg(type, game, frameWin, ms){
    return new Promise(resolve => {
      let done = false, t = null;
      function fin(v){ if(done) return; done = true; clearTimeout(t); window.removeEventListener("message", on); cancels.delete(cancel); resolve(v); }
      function on(e){ const d = e.data; if(e.source !== frameWin || !d || d.type !== type || d.game !== game) return; fin(d); }
      function cancel(){ fin(null); }
      t = setTimeout(() => fin(null), ms);
      cancels.add(cancel); window.addEventListener("message", on);
    });
  }

  function gameUrl(g){
    const muted = Sfx.isMuted() ? 1 : 0;
    return g.url + (g.url.indexOf("?") >= 0 ? "&" : "?") + "mini=1&sec=" + g.sec + "&mute=" + muted;

  function pickList(){
    const forced = (Q.get("ids") || "").split(",").map(s => s.trim()).filter(id => BY_ID[id]);
    if(forced.length) return forced.map(id => BY_ID[id]);
    const pool = chosenPool();
    for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    return pool.slice(0, PER_MEDLEY);
  }

  function setOverlay(o){
    $("overlay").hidden = !o;
    if(!o) return;
    $("ovKicker").textContent = o.kicker || "";

  }
  function sanitize(d, g){
    const raw = Number(d && d.score);
    const score = isFinite(raw) ? Math.max(0, Math.min(100, Math.round(raw))) : 0;
    return { game: g.id, name: g.name, score, detail: (d && d.detail) || null, error: null };
  }

  async function playOne(g, idx, n){
    const me = run;
    paintHud(idx, n, me.total);
    const kick = "NEXT  " + (idx + 1) + " / " + n;
    setOverlay({ kicker: kick, art: g.id, title: g.name, sub: "読み込み中…" });
    const frame = document.createElement("iframe");
    frame.setAttribute("allow", "autoplay"); frame.title = g.name; frame.src = gameUrl(g);

    } else {

      setOverlay({ kicker: kick, art: g.id, cmd, title: g.name, sub: g.tip }); if(cmd) Sfx.slam();
      await sleep(T.card); if(me.abort) return null;

      try { frame.focus(); frame.contentWindow.focus(); } catch (e) {}   // キー操作のゲームにキーを届ける
      frame.contentWindow.postMessage({ type: "mini-go" }, "*");
      const res = await waitMsg("mini-result", g.id, frame.contentWindow, g.sec * 1000 + T.grace);
      if(me.abort) return null;
      result = res ? sanitize(res, g) : { game: g.id, name: g.name, score: 0, detail: null, error: "result-timeout" };
    }
    frame.remove();
    return result;
  }

  async function runMedley(list){
    Sfx.ensure();
    PlayCounts.increment("mini-medley");
    run = { abort: false, list, results: [], total: 0, idx: 0 };
    const me = run;
    show("play");
    for(let i = 0; i < list.length; i++){
      me.idx = i;
      const r = await playOne(list[i], i, list.length);
      if(me.abort || run !== me || !r) return;
      const before = me.total;
      me.results.push(r); me.total += r.score;
      paintHud(i + 1, list.length, me.total);

      $("ovTitle").classList.add("bounce"); $("ovSub").classList.add("bounce");
      tweenNum($("ovTitle"), 0, r.score, 800, v => v + "点");

      if(me.abort || run !== me) return;
    }
    finish(me);
  }

  const RANKS = [[85, "S"], [70, "A"], [50, "B"], [0, "C"]];
  function rankOf(pct){ for(const r of RANKS) if(pct >= r[0]) return r[1]; return "C"; }
  let lastShare = "";
  function finish(me){
    const n = me.results.length, max = n * 100, pct = Math.round(me.total / max * 100);
    const rank = rankOf(pct);
    const better = Best.record(me.total, max);
    Sfx.clear();
    const rk = $("rank"); rk.textContent = rank; rk.className = "r" + rank;
    const rd = me.results.length * 0.16 + 0.9;             // ランクのスタンプは内訳が出そろってから

      "#ミニゲームメドレー",

    ].join("\n");
    paintBest(); show("result");
    if(!CALM){ retrigger(rk, "stamp"); setTimeout(() => { if(run === me || !run) { if($("result").classList.contains("active")){ Sfx.slam(); if(rank === "S") confetti(150); else if(rank === "A") confetti(60); } } }, rd * 1000 + 250); }
  }

  /* 紙吹雪(ランク S は多め・A は少なめ)。結果画面が出ている間だけ描き、約3秒で止める */
  let confettiRaf = 0;
  function confettiStop(){ if(confettiRaf) cancelAnimationFrame(confettiRaf); confettiRaf = 0; const c = $("confetti"); c.getContext("2d").clearRect(0, 0, c.width, c.height); }
  function confetti(n){
    if(CALM) return;
    confettiStop();
    const c = $("confetti"), box = $("result"), dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = box.clientWidth * dpr; c.height = box.clientHeight * dpr;
    const ctx = c.getContext("2d"), cols = ["#ff8fb3", "#ffb37a", "#ffd34e", "#7ddba4", "#6bc2ff", "#a970ff", "#fff"];
    const ps = [];
    for(let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, sp = (3 + Math.random() * 9) * dpr;
      ps.push({ x: c.width / 2, y: c.height * 0.22, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5 * dpr, w: (5 + Math.random() * 6) * dpr, h: (3 + Math.random() * 5) * dpr,
        r: Math.random() * 6, vr: (Math.random() - .5) * .5, col: cols[i % cols.length] });
    }
    const t0 = performance.now();
    (function step(now){
      const age = (now - t0) / 1000;
      ctx.clearRect(0, 0, c.width, c.height);
      ps.forEach(p => {
        p.vy += 0.12 * dpr; p.vx *= 0.99; p.vy *= 0.994; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, 3.2 - age)); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      if(age < 3.2) confettiRaf = requestAnimationFrame(step); else confettiStop();
    })(t0);
  }
  function quit(){
    if(run) run.abort = true;
    cancelAll();
    const f = $("frameWrap").querySelector("iframe"); if(f) f.remove();
    run = null; paintBest(); show("title");
  }
  function paintBest(){
    const b = Best.load();
    $("bestLabel").textContent = b.max ? ("自己ベスト " + b.total + " / " + b.max) : "";
  }

  /* =========================================================

  const LOOK = {

    "mochi-jump":         { ic:"🍡", a:"#7ddba4", b:"#4fc3d9" },
    "tennis-game":        { ic:"🎾", a:"#b6e04a", b:"#3fa96b" },
    "neon-void":          { ic:"🚀", a:"#a970ff", b:"#22e3ff" },
    "rhythm-game":        { ic:"🎵", a:"#ff6ba6", b:"#ffd34e" },
    "daily-claude-quiz":  { ic:"❓", a:"#ff9a4d", b:"#d8483f" },
    "daily-genai-quiz":   { ic:"🤖", a:"#6bc2ff", b:"#7a6bff" },
    "puyo-puyo-next-gen": { ic:"🫧", a:"#ff7ad0", b:"#7a6bff" },
    "tetris-next-gen":    { ic:"🧱", a:"#4fc3d9", b:"#2f6fd1" },
    "typing_quotes":      { ic:"⌨️", a:"#9aa6c4", b:"#4a5578" }
  };
  const AUTO_SPEED = REDUCED ? 0.05 : 0.38;      // ラジアン/秒(1周 約16秒)
  const cCards = []; let cAng = 0, cVel = AUTO_SPEED, cRaf = 0, cLast = 0, cDrag = null;
  function buildCarousel(){
    const el = $("carousel");
    GAMES.filter(g => !g.test && g.ready).forEach(function(g){      // 遊べるものだけ(準備中は載せない。ミニ版が公開されれば自動で増える)
      const lk = LOOK[g.id] || { ic:"🎮", a:"#9aa6c4", b:"#4a5578" };
      const c = document.createElement("div"); c.className = "cCard" + (g.ready ? "" : " soon");
      c.style.background = "linear-gradient(155deg," + lk.a + "," + lk.b + ")";
      const ic = document.createElement("div"); ic.className = "ic"; ic.textContent = lk.ic;
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = g.name;
      c.appendChild(ic); c.appendChild(nm);
      /* 実際のゲーム画面(img/<id>.jpg)があればカードの絵にする。読めなければ絵文字+グラデーションのまま */
      const probe = new Image();
      probe.onload = function(){
        const art = document.createElement("div"); art.className = "art"; art.style.backgroundImage = "url(" + artUrl(g.id) + ")";
        const sc = document.createElement("div"); sc.className = "scrim";
        c.insertBefore(sc, c.firstChild); c.insertBefore(art, c.firstChild); c.classList.add("hasArt");
      };
      probe.src = artUrl(g.id);
      if(!g.ready){ const tg = document.createElement("div"); tg.className = "tg"; tg.textContent = "準備中"; c.appendChild(tg); }
      el.appendChild(c); cCards.push(c);
    });
  }
  function carouselLayout(){
    const el = $("carousel"), n = cCards.length; if(!n) return;
    const rx = Math.min(el.clientWidth * 0.37, 185), ry = el.clientHeight * 0.075;
    cCards.forEach(function(c, i){
      const th = cAng + i * Math.PI * 2 / n;
      const z = Math.cos(th), k = (z + 1) / 2;                         // 1=いちばん手前 0=いちばん奥
      c.style.transform = "translate(" + (Math.sin(th) * rx).toFixed(1) + "px," + (-z * ry).toFixed(1) + "px) scale(" + (0.58 + 0.42 * k).toFixed(3) + ")";
      c.style.opacity = (0.28 + 0.72 * k).toFixed(3);
      c.style.zIndex = String(Math.round(k * 100));
    });
  }
  function carouselTick(now){
    const dt = Math.min(0.05, (now - cLast) / 1000); cLast = now;
    if(!cDrag){ cVel += (AUTO_SPEED - cVel) * Math.min(1, dt * 3); cAng += cVel * dt; }   // 離したあとは勢いが自動回転へ戻る
    carouselLayout(); cRaf = requestAnimationFrame(carouselTick);
  }
  function carouselStart(){ if(cRaf || !cCards.length) return; cLast = performance.now(); cRaf = requestAnimationFrame(carouselTick); }
  function carouselStop(){ if(cRaf) cancelAnimationFrame(cRaf); cRaf = 0; }
  (function bindCarousel(){
    const el = $("carousel");
    el.addEventListener("pointerdown", function(e){ cDrag = { x: e.clientX, t: performance.now(), id: e.pointerId }; el.classList.add("drag"); try { el.setPointerCapture(e.pointerId); } catch (err) {} });
    el.addEventListener("pointermove", function(e){
      if(!cDrag || e.pointerId !== cDrag.id) return;
      const now = performance.now(), dx = e.clientX - cDrag.x, dt = Math.max(1, now - cDrag.t) / 1000;
      const d = dx / Math.max(120, el.clientWidth * 0.34);               // 横にドラッグした分だけ回す
      cAng += d; cVel = d / dt; cDrag.x = e.clientX; cDrag.t = now; carouselLayout();
    });
    function end(e){ if(cDrag && e.pointerId === cDrag.id){ cDrag = null; el.classList.remove("drag"); cVel = Math.max(-3, Math.min(3, cVel)); } }
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  })();
  buildCarousel(); carouselLayout();

  function paintPoolInfo(){
    const n = chosenPool().length, all = playable().length;
    $("poolInfo").textContent = n === 0 ? "ゲームが1本もえらばれていません。1本以上えらんでください。"
      : (n <= PER_MEDLEY ? "えらんだ " + n + " 本をすべて遊びます。" : "えらんだ " + n + " 本から、" + PER_MEDLEY + "本がランダムに出ます。")
        + "（遊べるのは " + all + " 本）";
  }
  function paintSettings(){
    const box = $("gameList"); box.innerHTML = "";
    GAMES.filter(g => !g.test).forEach(g => {
      const ok = !!g.ready;
      const row = document.createElement("label"); row.className = "gRow" + (ok ? "" : " off");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = ok && !disabled.has(g.id); cb.disabled = !ok;
      cb.addEventListener("change", function(){
        if(cb.checked) disabled.delete(g.id); else disabled.add(g.id);
        saveDisabled(); paintPoolInfo();
      });
      const txt = document.createElement("span"); txt.className = "gTxt";
      const nm = document.createElement("b"); nm.textContent = g.name;
      const ds = document.createElement("i"); ds.textContent = DESC[g.id] || "";
      txt.appendChild(nm); txt.appendChild(ds);
      row.appendChild(cb); row.appendChild(thumbImg("gThumb", g.id)); row.appendChild(txt);
      if(!ok){ const tag = document.createElement("span"); tag.className = "gTag"; tag.textContent = "準備中"; row.appendChild(tag); }
      box.appendChild(row);
    });
    paintPoolInfo();
  }
  function start(){
    const list = pickList();
    if(!list.length){
      $("note").textContent = playable().length ? "えらんだゲームがありません（せっていで選んでください）" : "まだ遊べるゲームがありません（準備中）";
      return;
    }
    $("note").textContent = "";
    runMedley(list);
  }
  $("startBtn").addEventListener("click", start);
  $("retryBtn").addEventListener("click", start);
  $("toTitleBtn").addEventListener("click", quit);
  $("quitBtn").addEventListener("click", quit);
  $("howtoBtn").addEventListener("click", () => $("howtoOverlay").classList.add("show"));
  $("settingsBtn").addEventListener("click", () => { $("note").textContent = ""; paintSettings(); show("settings"); });
  $("settingsBackBtn").addEventListener("click", () => show("title"));
  $("allOnBtn").addEventListener("click", () => { disabled.clear(); saveDisabled(); paintSettings(); });
  $("howtoCloseBtn").addEventListener("click", () => $("howtoOverlay").classList.remove("show"));
  $("shareBtn").addEventListener("click", function(){
    const text = lastShare, btn = $("shareBtn");
    function done(msg){ btn.textContent = msg; setTimeout(function(){ btn.textContent = "結果を共有する"; }, 1800); }
    function copy(){
      function fallback(){
        const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done("コピーしました！"); } catch (e) { alert(text); }
        document.body.removeChild(ta);
      }
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ done("コピーしました！"); }, fallback); }
      else fallback();
    }
    if(navigator.share){ navigator.share({ text: text }).catch(function(err){ if(!err || err.name !== "AbortError") copy(); }); }
    else copy();
  });
  function paintMute(){ const on = Sfx.isMuted(); $("muteBtn").textContent = on ? "🔇" : "🔊"; $("muteBtn").classList.toggle("off", on); $("muteBtn").setAttribute("aria-pressed", on ? "true" : "false"); }
  $("muteBtn").addEventListener("click", function(e){ e.preventDefault(); Sfx.setMuted(!Sfx.isMuted()); paintMute(); });
  paintMute(); paintBest(); carouselStart();
  PlayCounts.fetchCount("mini-medley").then(function(c){ if(c != null) $("countLabel").textContent = "これまでに " + c.toLocaleString() + " 回プレイされています"; });

  /* テスト用フック */
  window.__medley = {
    games: GAMES.map(g => ({ id: g.id, ready: !!g.ready, sec: g.sec })),
    state(){ return run ? { abort: run.abort, idx: run.idx, total: run.total, results: run.results.slice(), frames: $("frameWrap").querySelectorAll("iframe").length } : null; },
    frames(){ return $("frameWrap").querySelectorAll("iframe").length; },
    shareText(){ return lastShare; },
    isMuted(){ return Sfx.isMuted(); },
    pool(){ return chosenPool().map(g => g.id); },
    carousel(){ return { angle: cAng, running: !!cRaf, cards: cCards.length }; },
    setDisabled(ids){ disabled = new Set(ids); saveDisabled(); },
    start,
  };
})();
</script>
</body>
</html>
